name: build storybook

on:
  # No base-branch filter, so a pull request stacked on another one is tested too.
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  build-storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
        env:
          # storybook-webmcp is hosted on GitHub Packages (npm.pkg.github.com).
          # Even public GHPR packages require an auth token.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1
      - name: Check the component index matches the library's exports
        run: npm run check:component-index -- --storybook-index storybook-static/index.json
