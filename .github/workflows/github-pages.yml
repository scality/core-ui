name: Deploy Storybook

on:
  push:
    branches: [development/1.0]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run storybook:deploy
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1
